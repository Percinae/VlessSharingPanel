name: Release and deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: vless-panel-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag and crate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release tag must point to a commit on main'; exit 1; }
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['package']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Tag must match Cargo.toml version')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Test application and deployment rollback
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
          bash deploy/test-activate.sh
      - name: Build static Linux binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/vless-sharing-panel dist/
          (cd dist && sha256sum vless-sharing-panel > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: vless-panel-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vless-panel-${{ github.ref_name }}
          path: dist/
      - name: Verify artifact and deploy over SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          : "${VPS_HOST:?Set production variable VPS_HOST}"
          : "${VPS_USER:?Set production variable VPS_USER}"
          : "${VPS_DEPLOY_KEY:?Set production secret VPS_DEPLOY_KEY}"
          : "${VPS_KNOWN_HOSTS:?Set production secret VPS_KNOWN_HOSTS}"
          VPS_PORT=${VPS_PORT:-22}
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || exit 1
          (cd dist && sha256sum --check SHA256SUMS)
          sha=$(sha256sum dist/vless-sharing-panel | cut -d' ' -f1)
          key_file="$RUNNER_TEMP/vless-deploy-key"
          hosts_file="$RUNNER_TEMP/vless-known-hosts"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hosts_file"
          unset VPS_DEPLOY_KEY VPS_KNOWN_HOSTS
          chmod 600 "$key_file" "$hosts_file"
          ssh_opts=(-i "$key_file" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file" -p "$VPS_PORT")
          scp_opts=(-i "$key_file" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file" -P "$VPS_PORT")
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/vless-panel/incoming/$RELEASE_TAG"
          scp "${scp_opts[@]}" dist/vless-sharing-panel "$VPS_USER@$VPS_HOST:/opt/vless-panel/incoming/$RELEASE_TAG/vless-sharing-panel"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE_TAG' '$sha'" < deploy/activate.sh
